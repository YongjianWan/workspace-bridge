name: Test (slow layer)

# slow 层（CLI spawn / 集成 / watch 类测试）不阻塞 PR，
# 但必须在 main 推送与每日定时中执行，防止只在本地跑导致回归裸奔。
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 18 * * *' # 每日 UTC 18:00（北京时间凌晨 2 点）
  workflow_dispatch:

jobs:
  slow:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install javalang for Java AST parser
        run: python -m pip install javalang

      - name: Run slow tests
        run: npm run test:slow
