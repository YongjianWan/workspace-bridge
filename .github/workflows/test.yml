name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Node engine compatibility
        run: node --version && npm --version

      - name: Probe Python / javalang availability
        shell: bash
        run: |
          python --version || true
          python -c "import javalang; print('javalang', javalang.__version__)" 2>&1 || true

      - name: Install javalang for Java AST parser
        run: python -m pip install javalang

      - name: Lint
        run: npm run lint

      - name: Run fast tests
        run: npm run test:fast

      - name: Run smoke tests
        run: npm run test:smoke

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install javalang for Java AST parser
        run: python3 -m pip install javalang

      - name: Check coverage gate
        run: npm run test:coverage:check
